<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GuardRail Forge</title>
  <link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
  <header><div><p class="eyebrow">AI SECURITY OPERATIONS</p><h1>GuardRail Forge</h1></div><div class="controls"><label>API key<input id="api-key" type="password" autocomplete="off" placeholder="Optional"></label><button id="refresh">Refresh</button></div></header>
  <main>
    <section class="metrics" aria-label="Security metrics">
      <article><span>Total scans</span><strong id="total">—</strong></article>
      <article><span>Blocked</span><strong id="blocked">—</strong></article>
      <article><span>Average risk</span><strong id="risk">—</strong></article>
      <article><span>Active alerts</span><strong id="alerts">—</strong></article>
    </section>
    <section class="panel"><div class="panel-title"><h2>Recent security activity</h2><span id="status" role="status">Loading…</span></div>
      <div class="table-wrap"><table><thead><tr><th>Time</th><th>Source</th><th>Action</th><th>Risk</th><th>Findings</th></tr></thead><tbody id="activity"></tbody></table></div>
      <p id="empty" hidden>No scans have been recorded yet.</p>
    </section>
  </main>
  <script src="/dashboard/app.js" defer></script>
</body>
</html>
