services:
  guardrail-forge:
    build: .
    image: guardrail-forge:1.0.0
    restart: unless-stopped
    init: true
    ports:
      - "${GUARDRAIL_PORT:-8000}:8000"
    environment:
      GUARDRAIL_API_KEY: "${GUARDRAIL_API_KEY:?Set GUARDRAIL_API_KEY}"
      GUARDRAIL_DATABASE_PATH: /data/guardrail.db
      GUARDRAIL_RATE_LIMIT_PER_MINUTE: "${GUARDRAIL_RATE_LIMIT_PER_MINUTE:-120}"
    volumes:
      - guardrail-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  guardrail-data:

